name: Build Stable Whisper CLI

on:
  push:
    paths:
      - '.github/workflows/fetch-whisper-model.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone whisper.cpp stable
        run: |
          git clone --depth 1 --branch v1.7.6 https://github.com/ggml-org/whisper.cpp.git whisper-src
      - name: Build
        run: |
          cmake -S whisper-src -B whisper-src/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build whisper-src/build --config Release -j2
      - name: Package runtime
        run: |
          cd whisper-src
          find build -type f \( -name 'whisper-cli' -o -name 'main' -o -name '*.so' -o -name '*.so.*' \) -print0 | tar --null -T - -czf ../whisper-v1.7.6-runtime.tar.gz
          cd ..
          ls -lh whisper-v1.7.6-runtime.tar.gz
      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: whisper-v1.7.6-runtime
          path: whisper-v1.7.6-runtime.tar.gz
          compression-level: 0
          retention-days: 1
