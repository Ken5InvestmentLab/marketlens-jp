name: Fetch Whisper Model Split

on:
  push:
    paths:
      - '.github/workflows/fetch-whisper-model.yml'

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download Whisper model
        run: |
          curl -L --fail --retry 5 --retry-delay 3             -o ggml-large-v3-turbo-q5_0.bin             https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          split -b 290M -d -a 2 ggml-large-v3-turbo-q5_0.bin whisper-model.part-
          ls -lh whisper-model.part-*
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: whisper-model-part-00
          path: whisper-model.part-00
          compression-level: 0
          retention-days: 1
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: whisper-model-part-01
          path: whisper-model.part-01
          compression-level: 0
          retention-days: 1
